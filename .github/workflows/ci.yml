name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install project and evaluation dependency
        run: python -m pip install -e '.[evaluation]'
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Verify admitted decisions and source hashes
        run: python scripts/acquisition_admissions.py
      - name: Verify publication checksums
        run: sha256sum -c data/acquisition_resume/2026-11-02/publication/publication.sha256
